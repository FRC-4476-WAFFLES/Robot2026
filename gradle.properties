# Build and simulate on the WPILib JDK.
#
# WPILib's JNI libraries check the MSVC runtime bundled *inside the JDK*, not the
# system Visual C++ redistributable. Most JDKs ship an old one. Without this,
# `simulateJava` throws MsvcRuntimeException ("Invalid MSVC Runtime Detected") and
# HAL-based tests hard-crash the JVM in msvcp140.dll.
#
# VS Code's WPILib extension passes this automatically, which is why simulation
# works from the extension but fails from a terminal. This makes plain
# `./gradlew` behave the same way.
#
# Not on Windows? Change this to <your home>/wpilib/2026/jdk
org.gradle.java.home=C:/Users/Public/wpilib/2026/jdk
